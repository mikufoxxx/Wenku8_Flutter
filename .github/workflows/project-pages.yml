name: Publish project page

on:
  push:
    branches: ['master']
    paths: ['site/**', 'docs/images/**', 'tools/build_project_site.py', '.github/workflows/project-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/check_public_source.py --revision "$(git rev-parse HEAD)"
      - run: python3 tools/build_project_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/project-site
      - uses: actions/deploy-pages@v5
        id: deployment
